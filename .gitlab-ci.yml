# .gitlab-ci.yml
image: docker:20.10.16

services:
  - docker:20.10.16-dind

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_NAME: registry.gitlab.com/ali-ayad/sparkit/spark-it-dash

stages:
  - build
  - staging

# ----------------------
# Build stage - runs on main and staging
# ----------------------
build:
  stage: build
  script:
    - echo "Docker info check"
    - docker info
    - echo "Building Docker image..."
    - docker build -t $IMAGE_NAME:$CI_COMMIT_REF_SLUG .
    - echo "Logging into GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Pushing Docker image..."
    - docker push $IMAGE_NAME:$CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "staging"'

# ----------------------
# Staging deployment - runs ONLY on staging branch
# ----------------------
staging:
  stage: staging
  script:
    - echo "Deploying to staging environment..."
    # Example: run the staging container
    - docker pull $IMAGE_NAME:$CI_COMMIT_REF_SLUG
    - docker stop sparkit-staging || true
    - docker rm sparkit-staging || true
    - docker run -d --name sparkit-staging -p 8080:80 $IMAGE_NAME:$CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'