# .gitlab-ci.yml
image: docker:20.10.16

services:
  - docker:20.10.16-dind

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_NAME: registry.gitlab.com/ali-ayad/sparkit/spark-it-dash

stages:
  - test
  - build
  - deploy

# ----------------------
# 1. TEST JOB: Using node for React/Vite app
# ----------------------
test-job:
  stage: test
  image: node:20
  script:
    - npm ci || npm install
    - npm run lint
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"

# ----------------------
# 2. BUILD JOB: Build the docker image
# ----------------------
build-job:
  stage: build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_NAME:$CI_COMMIT_REF_SLUG .
    - docker push $IMAGE_NAME:$CI_COMMIT_REF_SLUG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"

# ----------------------
# 3. DEPLOY JOB: Stop old container and run new one
# ----------------------
deploy-job:
  stage: deploy
  script:
    # 1. Login to Gitlab Registry
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # 2. Pull the latest image we just built
    - docker pull $IMAGE_NAME:$CI_COMMIT_REF_SLUG
    # 3. Stop and Remove old container if it exists
    - docker stop sparkit-dashboard || true
    - docker rm sparkit-dashboard || true
    # 4. Run the new React/Nginx container on port 8080 mapping to 80
    - docker run -d --name sparkit-dashboard -p 8080:80 $IMAGE_NAME:$CI_COMMIT_REF_SLUG
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"
