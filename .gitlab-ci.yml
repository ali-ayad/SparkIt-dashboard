# .gitlab-ci.yml
image: docker:20.10.16

services:
  - docker:20.10.16-dind

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_NAME: registry.gitlab.com/ali-ayad/sparkit/spark-it-dash

stages:
  - test
  - package
  - deploy

# 1. TEST STEP: Check for linting/errors
test:
  image: node:20
  stage: test
  script:
    - npm install
    - npm run lint
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"

# 2. PACKAGE STEP: Build and push the Docker image
package:
  stage: package
  script:
    - echo "Logging into GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Building Docker image..."
    - docker build -t $IMAGE_NAME:$CI_COMMIT_REF_SLUG .
    - echo "Pushing Docker image..."
    - docker push $IMAGE_NAME:$CI_COMMIT_REF_SLUG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"

# 3. DEPLOY STEP: Deploy and run the container
deploy:
  stage: deploy
  script:
    - echo "Deploying to environment..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_NAME:$CI_COMMIT_REF_SLUG
    - docker stop sparkit-staging || true
    - docker rm sparkit-staging || true
    - docker run -d --name sparkit-staging -p 8080:80 $IMAGE_NAME:$CI_COMMIT_REF_SLUG
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"
