# .gitlab-ci.yml
image: docker:20.10.16

services:
  - docker:20.10.16-dind

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_NAME: registry.gitlab.com/ali-ayad/sparkit/spark-it-dash

stages:
  - test
  - build
  - deploy

# ----------------------
# 1. TEST JOB: Using node (since this is a React app)
# ----------------------
test-job:
  stage: test
  image: node:20
  script:
    - npm install
    - npm run lint
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"

# ----------------------
# 2. BUILD JOB: Build the docker image
# ----------------------
build-job:
  stage: build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_NAME:$CI_COMMIT_REF_SLUG .
    - docker push $IMAGE_NAME:$CI_COMMIT_REF_SLUG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"

# ----------------------
# 3. DEPLOY JOB: Stop old container and run new one
# ----------------------
deploy-job:
  stage: deploy
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker stop staging || true
    - docker rm staging || true
    - docker pull $IMAGE_NAME:$CI_COMMIT_REF_SLUG
    - # Running on port 5001 as requested
    - docker run -d --name staging -p 5001:80 $IMAGE_NAME:$CI_COMMIT_REF_SLUG
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"
