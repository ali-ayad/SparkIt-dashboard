# .gitlab-ci.yml
image: docker:20.10.16

services:
  - docker:20.10.16-dind

variables:
  DOCKER_DRIVER: overlay2
  # Use different tags for clarity
  IMAGE_NAME: registry.gitlab.com/ali-ayad/sparkit/spark-it-dash

stages:
  - build
  - staging

# Build stage - runs on both main and staging
build:
  stage: build
  script:
    - docker info
    - docker build -t $IMAGE_NAME:$CI_COMMIT_REF_SLUG .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $IMAGE_NAME:$CI_COMMIT_REF_SLUG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"

# Staging stage - runs ONLY on the staging branch
staging:
  stage: staging
  script:
    - echo "Deploying to staging environment..."
    - # Add your specific staging deployment commands here (e.g., docker run, ssh, or cloud-specific CLI)
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
